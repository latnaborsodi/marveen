# MARVCI822: the repo's only workflow was the secret gate -- vitest and tsc
# never ran in CI for ANY PR, so every "N/N green" claim was a local
# measurement the PR head could not prove (found via the review of
# #1037/#1038, measured 2026-08-22).
#
# Deliberately NOT a required status check yet: flipping it to required at
# introduction would block every open PR whose head predates the workflow
# (the required-check-never-ran class). The switch to required is a separate
# owner/Marveen decision, gated on measuring how many open PRs run it green
# (decision msg 14205, recorded on the MARVCI822 card).
name: test

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Full install ON PURPOSE, unlike the secret-gate's --ignore-scripts:
      # the suite exercises native bindings, and an install that skips their
      # build would fail the ABI probe instead of measuring the code.
      - run: npm ci
      # The suite resolves the `claude` binary at module load (resolveFromPath
      # throws when it is absent) -- without this stub 17 suites fail at
      # COLLECTION, before a single test runs (measured on the first ubuntu
      # run). The stub satisfies PATH resolution only; it exits 1 LOUDLY, so if
      # any test ever actually executes claude, that run fails visibly instead
      # of silently faking success.
      - name: Stub the claude binary for PATH resolution
        run: |
          sudo install -m 755 /dev/stdin /usr/local/bin/claude <<'EOF'
          #!/bin/sh
          echo "claude CI stub: tests must not execute this binary" >&2
          exit 1
          EOF
      - run: npm run typecheck
      - run: npm test
      # Shell-test wiring (SEEDREFRESH826 fold-in, from the #1066 verify): a
      # regression guard that only runs manually rots exactly like a one-shot
      # seed. Runs natively here (ubuntu = the Linux branch it asserts).
      - run: bash scripts/__tests__/stop-start-system-unit.test.sh
      # PYGATES930: six tracked python guards lived under scripts/__tests__/
      # and NOTHING ran them -- the exact rot the comment above names, one
      # step further along. (A seventh, kinai-approval-reminder.test.py, still
      # exists only on the running tree and is out of scope here; it gets
      # picked up by this same glob the moment it is committed.) Wired here only AFTER isolating usage-collect's token
      # test: it read the HOST's real ~/.claude/.credentials.json and printed
      # the token in the assertion diff. This repo is PUBLIC, so wiring the
      # step up first would have turned a dormant test into a credential leak
      # on the first red run.
      #
      # The loop keeps its own failure flag on purpose, and both reasons were
      # measured rather than assumed. Under the runner's default `bash -e` a
      # bare `for ... do python3 "$t"; done` DOES fail, but it aborts on the
      # first red file: measured with a deliberately failing fixture sorted
      # first, only that one file of the seven in the run executed, so one
      # break hides the state of every guard behind it. Without -e (any future `shell:` override)
      # the same loop exits with the status of the LAST file only -- measured
      # exit 0 with a deliberately failing fixture first in the glob, a gate
      # that cannot fail. The flag gives both: every file runs, every failure
      # is named, the step still exits non-zero.
      #
      # The empty-glob branch fails too: a guard step that matches no files is
      # indistinguishable from a green one.
      - name: Python guards under scripts/__tests__
        run: |
          shopt -s nullglob
          tests=(scripts/__tests__/*.test.py)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "No python guards matched -- the glob or the directory moved." >&2
            exit 1
          fi
          failed=0
          for t in "${tests[@]}"; do
            echo "::group::$t"
            python3 "$t" || { failed=1; echo "FAILED: $t" >&2; }
            echo "::endgroup::"
          done
          echo "Ran ${#tests[@]} python guard file(s)."
          exit "$failed"
